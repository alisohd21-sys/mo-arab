<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مونوبولي أونلاين - P2P Professional</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --accent: #f59e0b; --bg: #0f172a; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* الواجهة */
        .screen { display: none; background: rgba(30, 41, 59, 0.9); padding: 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); text-align: center; width: 400px; }
        .active { display: block; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; text-align: center; }
        .btn { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: var(--accent); color: black; }

        /* اللوحة */
        #game-screen { width: 1000px; display: none; grid-template-columns: 650px 320px; gap: 20px; }
        #board { display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr); width: 650px; height: 650px; background: #e2e8f0; border: 8px solid #334155; position: relative; }
        .cell { border: 0.5px solid #94a3b8; background: white; color: #1e293b; font-size: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; }
        .center { grid-column: 2/11; grid-row: 2/11; background: #cbd5e1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .token { width: 20px; height: 20px; border-radius: 50%; position: absolute; z-index: 100; border: 2px solid white; transition: 0.5s; }
        
        .sidebar { background: #1e293b; padding: 20px; border-radius: 15px; }
        .log { height: 150px; overflow-y: auto; background: #0f172a; padding: 10px; font-size: 12px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen active">
        <h2>🎲 مونوبولي إكسبريس</h2>
        <input type="text" id="username" placeholder="أدخل اسمك">
        <hr>
        <button class="btn btn-main" onclick="startAI()">اللعب ضد الذكاء الاصطناعي</button>
        <hr>
        <p>اللعب أونلاين (جهازين مختلفين):</p>
        <button class="btn btn-sub" onclick="createRoom()">إنشاء غرفة جديدة</button>
        <div id="room-id-display" style="font-size: 12px; color: #fbbf24;"></div>
        <input type="text" id="join-id" placeholder="أدخل ID الصديق">
        <button class="btn btn-main" onclick="joinRoom()">انضمام لصديق</button>
    </div>

    <div id="game-screen">
        <div id="board">
            <div class="center">
                <h1 style="color: #ef4444; transform: rotate(-45deg);">MONOPOLY</h1>
                <div id="dice-val" style="font-size: 3rem;">🎲</div>
            </div>
            </div>
        <div class="sidebar">
            <div id="p1-info"><b>اللاعب 1:</b> <span id="bal1">1500</span>$</div>
            <div id="p2-info"><b>اللاعب 2:</b> <span id="bal2">1500</span>$</div>
            <hr>
            <div id="status">انتظار اللاعب الآخر...</div>
            <button id="roll-btn" class="btn btn-main" onclick="rollAction()" disabled>رمي النرد</button>
            <div class="log" id="game-log"></div>
        </div>
    </div>

    <div id="token0" class="token" style="background: #ef4444;"></div>
    <div id="token1" class="token" style="background: #3b82f6;"></div>

<script>
    let peer, conn;
    let myRole = ''; // 'host' or 'guest'
    let isAI = false;
    let state = {
        players: [{pos:0, bal:1500, name:''}, {pos:0, bal:1500, name:''}],
        turn: 0,
        owners: Array(40).fill(null)
    };

    // --- نظام الاتصال P2P ---
    function initPeer() {
        peer = new Peer();
        peer.on('open', id => {
            document.getElementById('room-id-display').innerText = "ID الخاص بك: " + id;
        });
        peer.on('connection', c => {
            conn = c;
            myRole = 'host';
            setupConn();
        });
    }

    function createRoom() {
        initPeer();
        alert("أرسل الـ ID لصديقك وانتظر انضمامه");
    }

    function joinRoom() {
        const id = document.getElementById('join-id').value;
        if(!id) return alert("أدخل ID أولاً");
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(id);
            myRole = 'guest';
            setupConn();
        });
    }

    function setupConn() {
        conn.on('open', () => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'grid';
            if(myRole === 'host') {
                state.players[0].name = document.getElementById('username').value || "المضيف";
                sendState();
            }
            addLog("تم الاتصال بنجاح!");
            initBoard();
            updateUI();
        });
        conn.on('data', data => {
            state = data;
            updateUI();
            checkMyTurn();
        });
    }

    // --- منطق اللعبة ---
    function startAI() {
        isAI = true;
        myRole = 'host';
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'grid';
        state.players[0].name = document.getElementById('username').value || "أنت";
        state.players[1].name = "الكمبيوتر";
        initBoard();
        updateUI();
        checkMyTurn();
    }

    function checkMyTurn() {
        const isMyTurn = (myRole === 'host' && state.turn === 0) || (myRole === 'guest' && state.turn === 1);
        document.getElementById('roll-btn').disabled = !isMyTurn;
        document.getElementById('status').innerText = isMyTurn ? "دورك الآن!" : "انتظار الخصم...";
        
        if(isAI && state.turn === 1) setTimeout(aiPlay, 1000);
    }

    function rollAction() {
        const d1 = Math.floor(Math.random()*6)+1;
        const d2 = Math.floor(Math.random()*6)+1;
        const move = d1+d2;
        const p = state.players[state.turn];
        
        p.pos = (p.pos + move) % 40;
        if(p.pos < move) p.bal += 200;
        
        // تبسيط المربعات (شراء تلقائي أو دفع إيجار)
        handleSquare(state.turn, p.pos);
        
        state.turn = state.turn === 0 ? 1 : 0;
        if(!isAI) sendState();
        updateUI();
        checkMyTurn();
    }

    function aiPlay() {
        if(state.turn === 1) rollAction();
    }

    function handleSquare(pIdx, pos) {
        const owner = state.owners[pos];
        if(pos !== 0 && owner === null) {
            // شراء تلقائي للتبسيط في هذا الكود
            state.players[pIdx].bal -= 100;
            state.owners[pos] = pIdx;
            addLog(`${state.players[pIdx].name} اشترى عقاراً`);
        } else if(owner !== null && owner !== pIdx) {
            state.players[pIdx].bal -= 50;
            state.players[owner].bal += 50;
            addLog(`${state.players[pIdx].name} دفع إيجاراً`);
        }
    }

    function sendState() { if(conn) conn.send(state); }

    function initBoard() {
        const b = document.getElementById('board');
        const map = [ [11,11],[11,10],[11,9],[11,8],[11,7],[11,6],[11,5],[11,4],[11,3],[11,2],[11,1],[10,1],[9,1],[8,1],[7,1],[6,1],[5,1],[4,1],[3,1],[2,1],[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8],[1,9],[1,10],[1,11],[2,11],[3,11],[4,11],[5,11],[6,11],[7,11],[8,11],[9,11],[10,11] ];
        for(let i=0; i<40; i++) {
            const c = document.createElement('div');
            c.className = 'cell';
            c.style.gridRow = map[i][0]; c.style.gridColumn = map[i][1];
            c.innerHTML = i===0 ? "🏁" : "🏢";
            c.id = "c"+i;
            b.appendChild(c);
        }
    }

    function updateUI() {
        document.getElementById('bal1').innerText = state.players[0].bal;
        document.getElementById('bal2').innerText = state.players[1].bal;
        state.players.forEach((p, i) => {
            const cell = document.getElementById('c'+p.pos).getBoundingClientRect();
            const t = document.getElementById('token'+i);
            t.style.top = (cell.top + window.scrollY + 5) + 'px';
            t.style.left = (cell.left + window.scrollX + (i*10)) + 'px';
        });
    }

    function addLog(m) {
        const l = document.getElementById('game-log');
        l.innerHTML = `<div>• ${m}</div>` + l.innerHTML;
    }
</script>
</body>
</html>
